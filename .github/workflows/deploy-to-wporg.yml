name: Deploy to WordPress.org

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Manual trigger — specify the tag to deploy (e.g. v2.1.0)'
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Push to WordPress.org SVN
    runs-on: ubuntu-latest

    permissions:
      # Needed to upload the release zip back to the GitHub Release.
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: WordPress Plugin Deploy
        id: deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        with:
          generate-zip: true
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: unstoppable-voting-polls-elections

      - name: Upload release zip as a GitHub Release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.deploy.outputs.zip-path }}
